[project]
name = "openschwa-eval"
version = "0.1.0"
description = "OpenSchwa offline evaluation harness: certifies feedback types before they ship"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "openschwa-engine",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

# Full runs need the acoustic model runtime; the fixture smoke suite does not.
[project.optional-dependencies]
ml = ["openschwa-engine[ml]"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.sources]
openschwa-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openschwa_eval"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
