[project]
name = "openschwa-training"
version = "0.1.0"
description = "OpenSchwa contrast fine-tuning: segment export + training scripts (Option 3)"
requires-python = ">=3.11"
dependencies = [
    "openschwa-engine",
    "openschwa-eval",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "openschwa-engine[ml]",
    # The training laptop is Debian 13 with driver 550 / CUDA 12.4. The PyPI
    # torch wheels for 2.5.1 bundle CUDA 12.4; anything newer (2.6+) bundles
    # 12.6/12.8+ and demands a driver >= 570. This pin keeps GPU training
    # working without system driver changes. torchaudio tracks torch's ABI,
    # so it is pinned in lockstep (silero-vad pulls it in).
    "torch==2.5.1",
    "torchaudio==2.5.1",
    # The ear pipeline (Phase 1): Common Voice streaming + g2p_en phonemizer
    # (CMU dictionary + rules, MIT). Data-prep only; nothing ships from them.
    "datasets>=2.19",
    "g2p-en>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv.sources]
openschwa-engine = { path = "../engine", editable = true }
openschwa-eval = { path = "../eval", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openschwa_training"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
